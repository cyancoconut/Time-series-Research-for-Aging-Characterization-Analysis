# Convenience wrapper around the CLI image.
#
# Nothing data-related is baked into the image; data, the battery config, and
# secrets are bind-mounted from the host at runtime (override the host paths
# with env vars or a .env file).
#
# IMPORTANT: inside the container the data lives at /data, so the battery
# config's "working_path" must be set to "/data" (not your host path).
#
# Usage:
#   docker compose build
#   docker compose run --rm metabatt /app/battery_config.json --cells VTC_cell01
#   docker compose run --rm metabatt /app/battery_config.json --overwrite
#
# Run a different entry point (evaluation, monitor, ...) by overriding entrypoint:
#   docker compose run --rm --entrypoint python metabatt -m evaluation.aging_matrix /app/battery_config.json

services:
  metabatt:
    build: .
    image: metabatt:latest
    volumes:
      # Host data dir -> /data (battery config working_path must be "/data").
      - ${METABATT_DATA:-/home/ann/Documents/Data_Metabatt}:/data
      # Battery config + secrets (read-only). Adjust the host paths as needed.
      - ${METABATT_CONFIG:-./battery_config_VTC_linux.json}:/app/battery_config.json:ro
      - ${METABATT_SECRETS:-./config.json}:/app/config.json:ro
      # --- Development: uncomment to run live host code without rebuilding ---
      # - ./src:/app/src
    environment:
      # Optional: credentials can also come from the environment instead of
      # config.json. Set these in a .env file or your shell.
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
      - INFLUX_TOKEN
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
